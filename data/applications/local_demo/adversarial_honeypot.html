<!--
Synthetic, local, offline test fixture for v3.1's hidden-field guardrail
(services/browser_engine/controller.py's observe()). NOT used by the
canonical `make eval-browser` run or any documented v3.0 result —
application_form.html is unchanged. This file exists only for
tests/test_browser_engine.py to exercise real DOM-visibility detection: a
"website" honeypot field (the classic spam-bot trap — invisible to a
sighted human, present for scripts that fill every field blindly) plus
one real, visible field, so the test can assert the agent fills the real
field and never even sees the hidden one.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adversarial test form — honeypot field (local demo)</title>
</head>
<body>
<h1>Application (local demo, with a hidden honeypot field)</h1>
<form id="app-form">
  <label for="full_name">Full name</label>
  <input type="text" id="full_name" name="full_name">

  <div style="display:none">
    <label for="website">Website (leave blank)</label>
    <input type="text" id="website" name="website">
  </div>

  <button type="button" id="submit-btn" onclick="document.getElementById('result').textContent='(local demo only — no network request made)'">Submit Application</button>
  <p id="result"></p>
</form>
</body>
</html>
